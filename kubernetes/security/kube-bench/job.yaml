# kube-bench CIS Benchmark Job
# Runs the CIS Kubernetes Benchmark against the cluster.
# Results are written to stdout as JSON.
#
# Usage:
#   kubectl apply -f kubernetes/security/kube-bench/
#   kubectl logs -n security job/kube-bench

apiVersion: batch/v1
kind: Job
metadata:
  name: kube-bench
  namespace: security
  labels:
    app: kube-bench
    component: security-scan
    app.kubernetes.io/part-of: cobalto-soc
spec:
  ttlSecondsAfterFinished: 86400  # Keep results for 24h
  template:
    spec:
      serviceAccountName: kube-bench-sa
      hostPID: true
      containers:
        - name: kube-bench
          image: aquasec/kube-bench:latest
          args:
            - "--version"
            - "1.15"
            - "--json"
          volumeMounts:
            - name: var-lib-etcd
              mountPath: /var/lib/etcd
              readOnly: true
            - name: var-lib-kubelet
              mountPath: /var/lib/kubelet
              readOnly: true
            - name: etc-kubernetes
              mountPath: /etc/kubernetes
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            readOnlyRootFilesystem: true
      restartPolicy: Never
      volumes:
        - name: var-lib-etcd
          hostPath:
            path: /var/lib/etcd
        - name: var-lib-kubelet
          hostPath:
            path: /var/lib/kubelet
        - name: etc-kubernetes
          hostPath:
            path: /etc/kubernetes
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-bench-sa
  namespace: security
  labels:
    app: kube-bench
    component: security-scan
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-bench-view
  labels:
    app: kube-bench
    component: security-scan
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: kube-bench-sa
    namespace: security
