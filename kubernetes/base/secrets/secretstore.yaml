# =============================================================================
# External Secrets Operator (ESO) Configuration
#
# Prerequisites:
#   1. Install External Secrets Operator: kubectl apply -f https://raw.githubusercontent.com/external-secrets/external-secrets/main/deploy/crds/bundle.yaml
#   2. Helm install: helm repo add external-secrets https://charts.external-secrets.io
#      helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
#   3. Vault must be initialized and unsealed (see vault/ directory)
#
# Usage:
#   kubectl apply -k kubernetes/base/secrets/
# =============================================================================

---
# ── Vault Connection ────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: cobalto-vault-store
  namespace: langgraph
  labels:
    app.kubernetes.io/name: cobalto-vault-store
    app.kubernetes.io/part-of: cobalto-soc
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        # Kubernetes auth — Vault validates using a K8s service account token
        kubernetes:
          mountPath: "kubernetes"
          role: "cobalto-app-role"
          serviceAccountRef:
            name: "langgraph-sa"
---
# ── LangGraph Agent Secrets ─────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: langgraph-secrets
  namespace: langgraph
  labels:
    app.kubernetes.io/name: langgraph-secrets
    app.kubernetes.io/part-of: cobalto-soc
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: cobalto-vault-store
    kind: SecretStore
  target:
    name: langgraph-secrets   # This will create a K8s Secret with this name
    creationPolicy: Owner
  data:
    - secretKey: openai-api-key
      remoteRef:
        key: "secret/cobalto/langgraph/openai"
        property: "api_key"
    - secretKey: hmac-secret
      remoteRef:
        key: "secret/cobalto/langgraph/hmac"
        property: "secret"
    - secretKey: qdrant-api-key
      remoteRef:
        key: "secret/cobalto/langgraph/qdrant"
        property: "api_key"
    - secretKey: cortex-api-key
      remoteRef:
        key: "secret/cobalto/langgraph/cortex"
        property: "api_key"
    - secretKey: opencti-api-key
      remoteRef:
        key: "secret/cobalto/langgraph/opencti"
        property: "api_key"
    - secretKey: slack-webhook-url
      remoteRef:
        key: "secret/cobalto/langgraph/slack"
        property: "webhook_url"
---
# ── Cobalt Console Secrets ──────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: console-secrets
  namespace: cobalt-console
  labels:
    app.kubernetes.io/name: console-secrets
    app.kubernetes.io/part-of: cobalto-soc
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: cobalto-vault-store
    kind: SecretStore
  target:
    name: console-secrets
    creationPolicy: Owner
  data:
    - secretKey: session-secret
      remoteRef:
        key: "secret/cobalto/console/session"
        property: "secret"
    - secretKey: oauth-client-id
      remoteRef:
        key: "secret/cobalto/console/oauth"
        property: "client_id"
    - secretKey: oauth-client-secret
      remoteRef:
        key: "secret/cobalto/console/oauth"
        property: "client_secret"
---
# ── Console Auth Secrets ────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: console-auth-secrets
  namespace: cobalto
  labels:
    app.kubernetes.io/name: console-auth-secrets
    app.kubernetes.io/part-of: cobalto-soc
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: cobalto-vault-store
    kind: SecretStore
  target:
    name: console-auth-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwt_secret
      remoteRef:
        key: "secret/cobalto/console-auth/jwt"
        property: "secret"
    - secretKey: users
      remoteRef:
        key: "secret/cobalto/console-auth/users"
        property: "credentials"
---
# ── n8n Secrets ─────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: n8n-secrets
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n-secrets
    app.kubernetes.io/part-of: cobalto-soc
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: cobalto-vault-store
    kind: SecretStore
  target:
    name: n8n-secrets
    creationPolicy: Owner
  data:
    - secretKey: webhook-secret
      remoteRef:
        key: "secret/cobalto/n8n/webhook"
        property: "secret"
    - secretKey: encryption-key
      remoteRef:
        key: "secret/cobalto/n8n/encryption"
        property: "key"
---
# ── Vault Auth Setup (run once) ─────────────────────────────────────
# After deploying ESO, configure Vault with:
#
#   vault secrets enable -path=secret kv-v2
#   vault auth enable kubernetes
#   vault write auth/kubernetes/config \
#     token_reviewer_jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
#     kubernetes_host="https://kubernetes.default.svc:443" \
#     kubernetes_ca_cert="$(cat /var/run/secrets/kubernetes.io/serviceaccount/ca.crt)"
#
#   vault policy write cobalto-app - <<EOF
#   path "secret/data/cobalto/*" {
#     capabilities = ["read"]
#   }
#   EOF
#
#   vault write auth/kubernetes/role/cobalto-app-role \
#     bound_service_account_names="langgraph-sa" \
#     bound_service_account_namespaces="langgraph,cobalt-console,n8n" \
#     policies="cobalto-app" \
#     ttl="1h"
