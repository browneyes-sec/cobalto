apiVersion: apps/v1
kind: Deployment
metadata:
  name: connector-mitre-attack
  namespace: opencti
  labels:
    app.kubernetes.io/name: connector-mitre-attack
    app.kubernetes.io/part-of: cobalto-soc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: connector-mitre-attack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: connector-mitre-attack
        app.kubernetes.io/part-of: cobalto-soc
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: connector-mitre-attack
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          image: opencti/connector-mitre-attack:6.0.0
          env:
            - name: OPENCTI_CONNECTOR_ID
              value: "connector-mitre-attack"
            - name: OPENCTI_CONNECTOR_TYPE
              value: "external-import"
            - name: OPENCTI_CONNECTOR_NAME
              value: "MITRE"
