# Cobalto Console — Nginx Security Configuration
# Implements security headers + JWT auth via auth_request

upstream console_auth {
    server console-auth:8001;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Auth Request Zone ──────────────────────────────────────────
    # Internal endpoint: validates JWT via auth service
    location = /_auth/verify {
        internal;
        proxy_pass http://console-auth/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header Authorization $http_authorization;

        # Timeout must be short — backend auth service is local
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;

        # Don't propagate auth response body to client
        proxy_set_header X-Auth-Request-Redirect $scheme://$host$request_uri;
    }

    # ── Public Paths (no auth required) ────────────────────────────
    location /login {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location /_next/static {
        expires 365d;
        add_header Cache-Control "public, immutable, no-transform";
        access_log off;
    }

    location /_next/data {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Auth endpoints are public (they handle their own auth)
    location /api/auth/ {
        proxy_pass http://console-auth/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 5s;

        # Rate limiting on login endpoint
        limit_req zone=authlogin burst=5 nodelay;
    }

    # ── Protected API Routes ───────────────────────────────────────
    location /api/ {
        # Validate JWT before proxying
        auth_request /_auth/verify;
        auth_request_set $auth_user $upstream_http_x_auth_user;

        proxy_pass http://cobalt-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass authenticated user info to backend
        proxy_set_header X-Auth-User $upstream_http_x_auth_user;
        proxy_set_header X-API-Key "";  # Backend API key not needed when auth'd via JWT

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;

        # Hide upstream headers
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        add_header X-Backend "cobalto-api" always;

        # Return 401 body for auth failures (otherwise nginx returns 401 with no body)
        error_page 401 = @error401;
    }

    # ── Main SPA (public — auth handled client-side) ──────────────
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # ── Security Headers (all responses) ──────────────────────────
    # Content Security Policy: restricts resource origins
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data:;
        font-src 'self' data:;
        connect-src 'self' https://*.cobalto.ai;
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self';
    " always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # ── Auth Error Handler ─────────────────────────────────────────
    location @error401 {
        add_header Content-Type application/json;
        return 401 '{"error":"unauthorized","message":"Valid JWT token required. POST /api/auth/login to authenticate."}';
    }

    # ── Deny access to sensitive paths ────────────────────────────
    location ~ /\.(git|env|svn|htaccess) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # ── Compression ───────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # ── Rate Limiting Zones ────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=console:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=authlogin:10m rate=5r/m;
    limit_req zone=console burst=20 nodelay;
}
