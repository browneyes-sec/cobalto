apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: console-auth-network-policy
  namespace: cobalto
  labels:
    app: console-auth
    component: auth
    app.kubernetes.io/part-of: cobalto-soc
spec:
  podSelector:
    matchLabels:
      app: console-auth
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cobalt-console
      ports:
        - protocol: TCP
          port: 8001
    - from:
        - podSelector:
            matchLabels:
              app: langgraph-api
      ports:
        - protocol: TCP
          port: 8001
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
      ports:
        - protocol: TCP
          port: 8200
